apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  # No resources-finalizer here: deleting this app must never delete ArgoCD itself.
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.10.5
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/hakanelgin/k3s-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/hakanelgin/k3s-gitops.git
      targetRevision: main
      path: platform/argocd/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
