# The generated ConfigMap name has a content hash, so editing index.html
# changes the Deployment's pod template and triggers a rollout.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx
resources:
  - deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: nginx-index
    files:
      - index.html
