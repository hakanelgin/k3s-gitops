apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: nginx
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts: [nginx.localtest.me]
      secretName: nginx-tls
  rules:
    - host: nginx.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
